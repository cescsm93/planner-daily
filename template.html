<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>规划师早报</title>
<meta name="description" content="每天 12 条：规划论文、政策、案例与 AI 工具">
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('pd_settings')||'{}');var t=s.theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.dataset.fs=s.fs||'md';}catch(e){document.documentElement.dataset.theme='dark'}})();
</script>
<style>
:root{--bg:#0d1117;--panel:#161d27;--panel2:#1c2431;--line:#2a3442;--text:#f3f6fa;--sub:#9aa6b5;--mute:#6c7888;--acc:#b5f07a;--accText:#11180a;--blue:#7cc4ff;--amber:#f5c26b;--pink:#f59ab5;--violet:#b8a4ff;--btn2:#202938;--fs:16px}
[data-theme=light]{--bg:#f3f5f8;--panel:#ffffff;--panel2:#f7f9fb;--line:#dde3ea;--text:#121821;--sub:#4f5b6a;--mute:#808b98;--acc:#8fd14f;--accText:#0f1a05;--blue:#1f78c8;--amber:#b7791f;--pink:#c2416b;--violet:#6c4fd8;--btn2:#eef1f5}
[data-fs=sm]{--fs:14.5px}[data-fs=lg]{--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:var(--fs);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px}
header.top h1{margin:0;font-size:1.35em;font-weight:800;letter-spacing:.02em}
header.top .dt{color:var(--sub);font-size:.85em;font-variant-numeric:tabular-nums}
.hero{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;gap:12px;align-items:flex-start}
.hero .l{flex:1;min-width:0}
.hero .lab{color:var(--acc);font-size:.72em;font-weight:700;letter-spacing:.14em}
.hero h2{margin:4px 0 6px;font-size:1.6em;line-height:1.25;font-weight:800}
.hero p{margin:0;color:var(--sub);font-size:.88em}
.hero .pick{display:block;margin-top:10px;color:var(--text);font-size:.84em;text-decoration:none;border-top:1px dashed var(--line);padding-top:9px}
.hero .pick b{color:var(--acc);font-weight:700;margin-right:6px}
.hero .num{text-align:right}
.hero .num b{display:block;font-size:2.2em;line-height:1;font-weight:800}
.hero .num span{color:var(--sub);font-size:.75em}
.tabs{display:flex;gap:8px;margin:16px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:7px 16px;font-size:.9em;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--accText);font-weight:700}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 16px 16px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--sub);font-size:.76em;padding-right:34px}
.meta .cat{font-weight:700}
.cat.papers{color:var(--blue)}.cat.policies{color:var(--amber)}.cat.cases{color:var(--pink)}.cat.tools{color:var(--violet)}
.flag{border:1px solid var(--amber);color:var(--amber);border-radius:5px;padding:0 5px;font-size:.92em;line-height:1.5}
.star{position:absolute;top:9px;right:9px;width:38px;height:38px;border:none;background:transparent;color:var(--mute);font-size:1.35em;cursor:pointer;border-radius:10px;line-height:1}
.star.on{color:var(--acc)}
.card h3{margin:7px 0 6px;font-size:1.12em;line-height:1.35;font-weight:800}
.card .brief{margin:0;color:var(--sub);font-size:.9em}
.card .use{margin:8px 0 0;font-size:.86em;color:var(--text);background:var(--panel2);border-radius:10px;padding:7px 10px}
.card .use b{color:var(--acc)}
[data-theme=light] .card .use b,[data-theme=light] .hero .lab,[data-theme=light] .hero .pick b{color:#4d8a13}
.card .note{margin:7px 0 0;color:var(--mute);font-size:.76em}
details{margin-top:8px}
summary{color:var(--mute);font-size:.8em;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}
details .det{color:var(--sub);font-size:.86em}
details .det .m{color:var(--mute);font-size:.92em;margin-bottom:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:.72em;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.acts{display:flex;gap:10px;margin-top:13px}
.btn{flex:1;display:flex;justify-content:center;align-items:center;height:44px;border-radius:12px;font-weight:700;font-size:.92em;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--accText)}
.btn.sec{flex:0 0 auto;padding:0 14px;background:var(--btn2);color:var(--text);border-color:var(--line);font-weight:600}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:.92em}
.ptitle{font-size:1.15em;font-weight:800;margin:4px 2px 12px}
.list a{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--text);text-decoration:none}
.list a.cur{border-color:var(--acc)}
.list a span{color:var(--sub);font-size:.82em}
.group{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:14px}
.group h4{margin:12px 0 2px;color:var(--sub);font-size:.78em;font-weight:600;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .k{font-size:.92em}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:none;background:transparent;color:var(--sub);padding:5px 9px;border-radius:8px;font-size:.8em;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accText);font-weight:700}
.sbtn{border:1px solid var(--line);background:var(--btn2);color:var(--text);border-radius:10px;padding:7px 12px;font-size:.84em;cursor:pointer}
.sbtn.danger{color:#ff7b7b}
.about{color:var(--sub);font-size:.85em;padding:10px 0}
.about p{margin:0 0 6px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bar .in{max-width:560px;margin:0 auto;display:flex}
nav.bar button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 0 11px;font-size:.78em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bar button i{font-style:normal;font-size:1.25em;line-height:1.2}
nav.bar button.on{color:var(--acc);font-weight:700}
[data-theme=light] nav.bar button.on{color:#4d8a13}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.85em;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--sub);font-size:.82em;margin-bottom:12px}
.banner a{color:var(--acc)}
@media(min-width:900px){.wrap{padding-top:28px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1>规划师早报</h1><div class="dt" id="dt"></div></header>
<main id="view"></main>
</div>
<nav class="bar"><div class="in">
<button data-v="today"><i>☀</i>今日</button>
<button data-v="fav"><i>★</i>收藏夹</button>
<button data-v="past"><i>☰</i>往期</button>
<button data-v="set"><i>⚙</i>设置</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>
var LATEST=__DATA__;
var DATES=__DATES__;
var NAMES={papers:'论文',policies:'政策',cases:'案例',tools:'AI工具'};
var ORDER=['papers','policies','cases','tools'];
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=Object.assign({theme:'dark',fs:'md',tab:'all',target:'new'},load('pd_settings',{}));
var FAV=load('pd_favs',[]);
var ISSUE=LATEST, tab=S.tab, view='today';
var WD=['周日','周一','周二','周三','周四','周五','周六'];
function md(dt){var p=dt.split('-');return p[1]+'.'+p[2]}
function wd(dt){var p=dt.split('-');return WD[new Date(+p[0],p[1]-1,+p[2]).getDay()]}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},1600)}
function applySettings(){var t=S.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.dataset.fs=S.fs;save('pd_settings',S)}
matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){if(S.theme==='system')applySettings()});
function key(it){return it.url}
function isFav(it){return FAV.some(function(f){return f.url===it.url})}
function toggleFav(it,sec,date){if(isFav(it)){FAV=FAV.filter(function(f){return f.url!==it.url});toast('已取消收藏')}else{FAV.unshift({title:it.title,url:it.url,source:it.source,date:it.date,brief:it.brief,use:it.use,section:sec,issue:date,note:it.note,flag:it.flag,savedAt:Date.now()});toast('已收藏')}save('pd_favs',FAV)}
function tgt(){return S.target==='same'?'':' target="_blank" rel="noopener"'}
function card(it,sec,date,idx){
  var star=isFav(it);
  var h='<article class="card" data-sec="'+sec+'"><button class="star'+(star?' on':'')+'" data-fav="'+idx+'" aria-label="收藏">'+(star?'★':'☆')+'</button>';
  h+='<div class="meta"><span class="cat '+sec+'">'+NAMES[sec]+'</span><span>·</span><span>'+esc(it.source)+(it.note?' ※':'')+'</span><span>·</span><span>'+esc(it.date||'')+'</span>'+(it.flag?'<span class="flag">'+esc(it.flag)+'</span>':'')+'</div>';
  h+='<h3>'+esc(it.title)+'</h3><p class="brief">'+esc(it.brief)+'</p>';
  if(it.use)h+='<p class="use"><b>规划用法</b>　'+esc(it.use)+'</p>';
  if(it.detail||it.meta||it.tags){h+='<details><summary>展开详情 ▾</summary><div class="det">'+(it.meta?'<div class="m">'+esc(it.meta)+'</div>':'')+(it.detail?esc(it.detail):'')+'</div>'+(it.tags&&it.tags.length?'<div class="tags">'+it.tags.map(function(t){return'<span>'+esc(t)+'</span>'}).join('')+'</div>':'')+'</details>'}
  if(it.note)h+='<p class="note">※ '+esc(it.note)+'</p>';
  h+='<div class="acts"><a class="btn pri" href="'+esc(it.url)+'"'+tgt()+'>打开原文</a>'+(it.extra?'<a class="btn sec" href="'+esc(it.extra.url)+'"'+tgt()+'>'+esc(it.extra.label)+'</a>':'')+'</div></article>';
  return h}
var REG=[];
function allItems(d){var a=[];ORDER.forEach(function(id){var s=(d.sections||[]).find(function(x){return x.id===id});if(s)s.items.forEach(function(it){a.push([it,id])})});return a}
function renderToday(){
  var d=ISSUE,items=allItems(d);REG=[];
  $('#dt').textContent=md(d.date)+' '+(d.weekday||wd(d.date));
  var hero=d.hero||{},pk='';
  if(hero.pick){var ps=d.sections.find(function(x){return x.id===hero.pick.section});var pi=ps&&ps.items[hero.pick.index];if(pi)pk='<a class="pick" href="'+esc(pi.url)+'"'+tgt()+'><b>首推</b>'+esc(pi.title)+' →</a>'}
  var h='';
  if(d.date!==LATEST.date)h+='<div class="banner">正在看往期 '+esc(d.date)+' · <a href="./">回到今日</a></div>';
  h+='<section class="hero"><div class="l"><div class="lab">'+esc(hero.label||'MORNING BRIEF')+'</div><h2>'+esc(hero.title||'今天，先读一篇')+'</h2><p>'+esc(hero.subtitle||'论文、政策、案例与 AI 工具，先看最值得打开的内容。')+'</p>'+pk+'</div><div class="num"><b>'+items.length+'</b><span>条待读</span></div></section>';
  h+='<div class="tabs">'+['all'].concat(ORDER).map(function(t){return'<button data-tab="'+t+'" class="'+(t===tab?'on':'')+'">'+(t==='all'?'全部':NAMES[t])+'</button>'}).join('')+'</div><div id="cards">';
  items.forEach(function(p){if(tab==='all'||tab===p[1]){REG.push([p[0],p[1],d.date]);h+=card(p[0],p[1],d.date,REG.length-1)}});
  if(!REG.length)h+='<div class="empty">这一期这个栏目暂时没有内容</div>';
  $('#view').innerHTML=h+'</div>'}
function renderFav(){
  REG=[];$('#dt').textContent='共 '+FAV.length+' 条';
  var h='<div class="ptitle">收藏夹</div>';
  if(!FAV.length)h+='<div class="empty">还没有收藏。点卡片右上角的 ☆ 就能收藏，收藏会保存在这台设备的浏览器里。</div>';
  FAV.forEach(function(f){REG.push([f,f.section,f.issue]);var it=Object.assign({},f);h+=card(it,f.section||'papers',f.issue,REG.length-1).replace('</h3>','</h3>'+(f.issue?'<div class="meta" style="margin:-2px 0 6px">收自 '+esc(f.issue)+' 期</div>':''))});
  $('#view').innerHTML=h}
function renderPast(){
  $('#dt').textContent=DATES.length+' 期';
  var h='<div class="ptitle">往期</div><div class="list">';
  DATES.slice().reverse().forEach(function(dt,i){h+='<a href="?d='+dt+'" class="'+(dt===ISSUE.date?'cur':'')+'">第 '+(DATES.length-i)+' 期 · '+dt+'<span>'+wd(dt)+(dt===LATEST.date?' · 最新':'')+'</span></a>'});
  $('#view').innerHTML=h+'</div>'}
function seg(name,opts){return'<div class="seg">'+opts.map(function(o){return'<button data-set="'+name+'" data-val="'+o[0]+'" class="'+(S[name]===o[0]?'on':'')+'">'+o[1]+'</button>'}).join('')+'</div>'}
function renderSet(){
  $('#dt').textContent='本机保存';
  var h='<div class="ptitle">设置</div>';
  h+='<div class="group"><h4>显示</h4><div class="row"><span class="k">外观</span>'+seg('theme',[['dark','深色'],['light','浅色'],['system','跟随系统']])+'</div><div class="row"><span class="k">字号</span>'+seg('fs',[['sm','小'],['md','标准'],['lg','大']])+'</div><div class="row"><span class="k">默认栏目</span>'+seg('tab',[['all','全部'],['papers','论文'],['policies','政策'],['cases','案例'],['tools','AI工具']])+'</div><div class="row"><span class="k">链接打开方式</span>'+seg('target',[['new','新标签页'],['same','当前页']])+'</div></div>';
  h+='<div class="group"><h4>收藏管理（'+FAV.length+' 条）</h4><div class="row"><span class="k">导出收藏</span><span><button class="sbtn" id="exJson">下载 .json</button> <button class="sbtn" id="exText">复制为文本</button></span></div><div class="row"><span class="k">清空收藏</span><button class="sbtn danger" id="clr">清空</button></div></div>';
  h+='<div class="group"><h4>分享</h4><div class="row"><span class="k">把早报分享给同事</span><button class="sbtn" id="share">复制本站链接</button></div></div>';
  h+='<div class="group"><h4>关于</h4><div class="about"><p>每天早上 8 点前更新：论文、政策、案例、AI 工具各 3 条。</p><p>内容来自公开来源，※ 表示非官方转载或媒体报道；“外省”表示非江苏本省文件。</p><p>仅供参考，以原文为准。设置和收藏只保存在本机浏览器里。</p></div></div>';
  $('#view').innerHTML=h}
function render(){document.querySelectorAll('nav.bar button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});({today:renderToday,fav:renderFav,past:renderPast,set:renderSet})[view]();}
function siteUrl(){return location.origin+location.pathname}
function copy(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(ok)},function(){prompt('复制下面的内容',t)})}else prompt('复制下面的内容',t)}
document.addEventListener('click',function(e){
  var b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.v){view=b.dataset.v;history.replaceState(null,'',view==='today'?location.search.replace(/[?&]v=\w+/,''):'?'+(ISSUE.date!==LATEST.date?'d='+ISSUE.date+'&':'')+'v='+view);render();scrollTo(0,0);return}
  if(b.dataset.tab){tab=b.dataset.tab;renderToday();return}
  if(b.dataset.fav!=null){var r=REG[+b.dataset.fav];toggleFav(r[0],r[1],r[2]);render();return}
  if(b.dataset.set){S[b.dataset.set]=b.dataset.val;if(b.dataset.set==='tab')tab=S.tab;applySettings();renderSet();return}
  if(b.id==='exJson'){var blob=new Blob([JSON.stringify(FAV,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='规划师早报-收藏-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已下载');return}
  if(b.id==='exText'){if(!FAV.length){toast('还没有收藏');return}copy(FAV.map(function(f,i){return(i+1)+'. 【'+(NAMES[f.section]||'')+'】'+f.title+'（'+(f.source||'')+'，'+(f.date||'')+'）\n'+f.url}).join('\n'),'已复制 '+FAV.length+' 条');return}
  if(b.id==='clr'){if(FAV.length&&confirm('确定清空全部 '+FAV.length+' 条收藏？此操作不能撤销。')){FAV=[];save('pd_favs',FAV);renderSet();toast('已清空')}return}
  if(b.id==='share'){var u=siteUrl();if(navigator.share&&/Mobi|Android|iPhone/i.test(navigator.userAgent)){navigator.share({title:'规划师早报',text:'每天 12 条规划论文、政策、案例与 AI 工具',url:u}).catch(function(){})}else copy(u,'已复制本站链接');return}
});
(function init(){
  var q=new URLSearchParams(location.search),d=q.get('d'),v=q.get('v');
  if(v&&/^(today|fav|past|set)$/.test(v))view=v;
  if(d&&d!==LATEST.date&&DATES.indexOf(d)>=0){fetch('data/'+d+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){ISSUE=j;render()}).catch(function(){render();toast('没找到 '+d+' 这一期')})}
  render()})();
</script>
</body>
</html>

区典型案例。", "use": "做完整社区实施方案时，可借鉴“功能腾挪＋闲置用房改造＋长效运维”的组合，而不是只新增一处活动室。", "detail": "以南通网报道为准；全球报告原文以发布方文本为准。", "tags": ["完整社区", "城市更新", "南通"], "url": "https://www.ntrb.com.cn/content/2026-11/05/c36855657.htm"}, {"title": "宜昌伍家岗新开放三处口袋公园：校门口、桥旁与车管所门口", "source": "湖北省住房和城乡建设厅（转三峡日报）", "meta": "儿童友好、书香文化与交通安全主题", "date": "2026-11-06", "flag": "外省", "brief": "伍家岗区三处口袋公园近日建成开放：实验中小学门口约 1000 平方米的儿童友好口袋公园，由原先普通草地改造，设置学生作品展示栏、主题雕塑，并沿绿化带布置百余米围栏座椅方便家长接送；夷陵长江大桥旁的北山坡口袋公园以书香文化为主题，设打卡墙、大桥时光长廊和约 120 平方米书名景墙；车管所门口的橘乡苑口袋公园占地约 3900 平方米，在绿地和休闲设施之外增加交通安全宣传。", "use": "利用学校出入口、桥下或桥旁边角地做口袋公园时，可对照其“等候座椅＋主题展示”的配建方式，先补家长和老人最常用的歇脚功能。", "detail": "外省（湖北）报道，转载于省住建厅网站，以三峡日报原文为准。", "tags": ["口袋公园", "儿童友好", "宜昌"], "url": "https://zjt.hubei.gov.cn/bmdt/dtyw/szsm/202611/t20261106_6071481.shtml"}, {"title": "广州越秀人民街“童趣园”：问需于民后把荒废空地改成儿童友好口袋公园", "source": "信息时报", "meta": "一德西社区微改造完工", "date": "2026-11-07", "flag": "外省", "brief": "越秀区人民街道一德西社区“儿童友好社区建设与口袋公园焕新提升”微改造近日完工。社区通过线上小程序和线下问卷征集全龄意见，形成墙体翻新、路面修复、绿化补植、照明加装等 10 余项改造清单；出入口实施物理围蔽禁止电动车入园，并铺设彩色防滑地垫、绘制地面游戏、增设休闲座椅，把原先被杂物和车辆挤占的空地改成全龄友好休闲空间。", "use": "做社区微更新方案时，可借鉴其“四议两公开＋双渠道征集”形成改造清单，并把出入口管理写进设计，避免做成后又被电动车占用。", "detail": "外省（广东）地方报纸报道，以原文为准。", "tags": ["口袋公园", "儿童友好", "广州"], "url": "https://xxsb.gz-cmc.com/pages/2026/11/07/67de6d60eef040b49ea04c88560a88c8.html", "note": "非官方来源（地方报纸报道）"}]}, {"id": "tools", "name": "AI工具", "items": [{"title": "天津滨海新区上线低效用地再开发 AI 平台：政策问答＋地块研判", "source": "凤凰网（转载）", "meta": "市规划资源局滨海新区分局 · 三级政策归集", "date": "2026-11-05", "flag": "外省", "brief": "天津市规划资源局滨海新区分局上线低效用地再开发 AI 平台，一站整合国家、市、区三级低效用地盘活、产业用地升级和存量改造政策，并收录典型案例与解读。平台提供 AI 问答，可用自然语言咨询闲置厂房改配套、存量盘活补贴等适用条款；录入地块信息后，可生成“政策依据＋经典案例＋实操路径”的研判结果，辅助选择合规盘活方式。", "use": "调研低效用地再开发工具时，可把它当作“政策检索＋地块出路径”的产品原型，同时要求对方说明政策库更新频率和研判依据是否可核验。", "detail": "外省（天津）平台上线报道，能力以官方后续说明和实际使用为准。", "tags": ["低效用地", "政策问答", "天津"], "url": "https://feng.ifeng.com/c/8xoShTnTRDV", "note": "非官方来源（商业网站转载）"}, {"title": "韩国将试点 AI 综合开发许可预评估：用日常语言先问能不能批", "source": "Aju Press", "meta": "国土交通部＋科技部 · 明年 1 月 5 地试点", "date": "2026-11-04", "flag": "境外", "brief": "韩国国土交通部与科技部在第 18 届 K-Geo Festa 公布“基于 AI 的综合许可预评估服务”研发与演示结果。该服务分析与土地开发相关的法律和地方条例，用户用日常语言提问，系统理解意图后检索许可要件并给出预评估；已整合多个 AI 智能体功能。计划 2027 年 1 月先在仁川桂阳、忠北阴城、忠南牙山及庆北庆山、永川试点，6 月视效果扩大到 18 个地方政府，并在年底前推出移动端和公务人员行政工具。", "use": "对照国内规划许可预审、告知承诺等改革时，可关注其“先预评估、再验证可靠性、再扩面”的试点节奏，而不是一次性全市铺开。", "detail": "境外（韩国）英文媒体报道，试点范围与上线时间以韩方正式公告为准。", "tags": ["规划许可", "预评估", "韩国"], "url": "https://www.ajupress.com/view/20261104160070622", "note": "非官方来源（境外媒体报道）"}, {"title": "黄冈规划建设数字化管控平台：3224 个图层做多规冲突识别与选址预审", "source": "极目新闻（转载湖北日报）", "meta": "市县一体 · 审批时限压缩约 25%", "date": "2026-11-02", "flag": "外省", "brief": "黄冈以战略规划为底图叠加各类规划，建成全省首个市县一体规划建设数字化管控平台，整合 3224 个从省级战略到底层专项的图层，覆盖合规性审查、差异冲突协调、重大项目选址等七大模块。平台上线后累计消除差异化图斑约 2.5 万个；冲突从图纸人工比对改为系统识别冲突图斑并在线会商，报道称最快 3 天可达成一致。武穴匡山旅游集散中心等项目可在策划阶段一键分析“三区三线”压覆并生成合规审查报告。依托平台实行并联审批后，市政基础设施、一般社会投资和一般工业类项目审批时限至少压缩 25%，已服务 1000 多个项目选址。", "use": "评估本地“多规合一”或项目选址预审平台时，可对照其冲突图斑在线协同、选址阶段先出合规报告的做法，检查能否真正缩短部门会商周期。", "detail": "外省（湖北）媒体报道中的运行数据，以当地平台和后续官方口径为准。", "tags": ["多规合一", "选址预审", "黄冈"], "url": "https://www.ctdsb.net/c1676_202611/2894439.html", "note": "非官方来源（媒体报道）"}]}]};

  var star=isFav(it);
  var h='<article class="card" data-sec="'+sec+'"><button class="star'+(star?' on':'')+'" data-fav="'+idx+'" aria-label="收藏">'+(star?'★':'☆')+'</button>';
  h+='<div class="meta"><span class="cat '+sec+'">'+NAMES[sec]+'</span><span>·</span><span>'+esc(it.source)+(it.note?' ※':'')+'</span><span>·</span><span>'+esc(it.date||'')+'</span>'+(it.flag?'<span class="flag">'+esc(it.flag)+'</span>':'')+'</div>';
  h+='<h3>'+esc(it.title)+'</h3><p class="brief">'+esc(it.brief)+'</p>';
  if(it.use)h+='<p class="use"><b>规划用法</b>　'+esc(it.use)+'</p>';
  if(it.detail||it.meta||it.tags){h+='<details><summary>展开详情 ▾</summary><div class="det">'+(it.meta?'<div class="m">'+esc(it.meta)+'</div>':'')+(it.detail?esc(it.detail):'')+'</div>'+(it.tags&&it.tags.length?'<div class="tags">'+it.tags.map(function(t){return'<span>'+esc(t)+'</span>'}).join('')+'</div>':'')+'</details>'}
  if(it.note)h+='<p class="note">※ '+esc(it.note)+'</p>';
  h+='<div class="acts"><a class="btn pri" href="'+esc(it.url)+'"'+tgt()+'>打开原文</a>'+(it.extra?'<a class="btn sec" href="'+esc(it.extra.url)+'"'+tgt()+'>'+esc(it.extra.label)+'</a>':'')+'</div></article>';
  return h}
var REG=[];
function allItems(d){var a=[];ORDER.forEach(function(id){var s=(d.sections||[]).find(function(x){return x.id===id});if(s)s.items.forEach(function(it){a.push([it,id])})});return a}
function renderToday(){
  var d=ISSUE,items=allItems(d);REG=[];
  $('#dt').textContent=md(d.date)+' '+(d.weekday||wd(d.date));
  var hero=d.hero||{},pk='';
  if(hero.pick){var ps=d.sections.find(function(x){return x.id===hero.pick.section});var pi=ps&&ps.items[hero.pick.index];if(pi)pk='<a class="pick" href="'+esc(pi.url)+'"'+tgt()+'><b>首推</b>'+esc(pi.title)+' →</a>'}
  var h='';
  if(d.date!==LATEST.date)h+='<div class="banner">正在看往期 '+esc(d.date)+' · <a href="./">回到今日</a></div>';
  h+='<section class="hero"><div class="l"><div class="lab">'+esc(hero.label||'MORNING BRIEF')+'</div><h2>'+esc(hero.title||'今天，先读一篇')+'</h2><p>'+esc(hero.subtitle||'论文、政策、案例与 AI 工具，先看最值得打开的内容。')+'</p>'+pk+'</div><div class="num"><b>'+items.length+'</b><span>条待读</span></div></section>';
  h+='<div class="tabs">'+['all'].concat(ORDER).map(function(t){return'<button data-tab="'+t+'" class="'+(t===tab?'on':'')+'">'+(t==='all'?'全部':NAMES[t])+'</button>'}).join('')+'</div><div id="cards">';
  items.forEach(function(p){if(tab==='all'||tab===p[1]){REG.push([p[0],p[1],d.date]);h+=card(p[0],p[1],d.date,REG.length-1)}});
  if(!REG.length)h+='<div class="empty">这一期这个栏目暂时没有内容</div>';
  $('#view').innerHTML=h+'</div>'}
function renderFav(){
  REG=[];$('#dt').textContent='共 '+FAV.length+' 条';
  var h='<div class="ptitle">收藏夹</div>';
  if(!FAV.length)h+='<div class="empty">还没有收藏。点卡片右上角的 ☆ 就能收藏，收藏会保存在这台设备的浏览器里。</div>';
  FAV.forEach(function(f){REG.push([f,f.section,f.issue]);var it=Object.assign({},f);h+=card(it,f.section||'papers',f.issue,REG.length-1).replace('</h3>','</h3>'+(f.issue?'<div class="meta" style="margin:-2px 0 6px">收自 '+esc(f.issue)+' 期</div>':''))});
  $('#view').innerHTML=h}
function renderPast(){
  $('#dt').textContent=DATES.length+' 期';
  var h='<div class="ptitle">往期</div><div class="list">';
  DATES.slice().reverse().forEach(function(dt,i){h+='<a href="?d='+dt+'" class="'+(dt===ISSUE.date?'cur':'')+'">第 '+(DATES.length-i)+' 期 · '+dt+'<span>'+wd(dt)+(dt===LATEST.date?' · 最新':'')+'</span></a>'});
  $('#view').innerHTML=h+'</div>'}
function seg(name,opts){return'<div class="seg">'+opts.map(function(o){return'<button data-set="'+name+'" data-val="'+o[0]+'" class="'+(S[name]===o[0]?'on':'')+'">'+o[1]+'</button>'}).join('')+'</div>'}
function renderSet(){
  $('#dt').textContent='本机保存';
  var h='<div class="ptitle">设置</div>';
  h+='<div class="group"><h4>显示</h4><div class="row"><span class="k">外观</span>'+seg('theme',[['dark','深色'],['light','浅色'],['system','跟随系统']])+'</div><div class="row"><span class="k">字号</span>'+seg('fs',[['sm','小'],['md','标准'],['lg','大']])+'</div><div class="row"><span class="k">默认栏目</span>'+seg('tab',[['all','全部'],['papers','论文'],['policies','政策'],['cases','案例'],['tools','AI工具']])+'</div><div class="row"><span class="k">链接打开方式</span>'+seg('target',[['new','新标签页'],['same','当前页']])+'</div></div>';
  h+='<div class="group"><h4>收藏管理（'+FAV.length+' 条）</h4><div class="row"><span class="k">导出收藏</span><span><button class="sbtn" id="exJson">下载 .json</button> <button class="sbtn" id="exText">复制为文本</button></span></div><div class="row"><span class="k">清空收藏</span><button class="sbtn danger" id="clr">清空</button></div></div>';
  h+='<div class="group"><h4>分享</h4><div class="row"><span class="k">把早报分享给同事</span><button class="sbtn" id="share">复制本站链接</button></div></div>';
  h+='<div class="group"><h4>关于</h4><div class="about"><p>每天早上 8 点前更新：论文、政策、案例、AI 工具各 3 条。</p><p>内容来自公开来源，※ 表示非官方转载或媒体报道；“外省”表示非江苏本省文件。</p><p>仅供参考，以原文为准。设置和收藏只保存在本机浏览器里。</p></div></div>';
  $('#view').innerHTML=h}
function render(){document.querySelectorAll('nav.bar button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});({today:renderToday,fav:renderFav,past:renderPast,set:renderSet})[view]();}
function siteUrl(){return location.origin+location.pathname}
function copy(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(ok)},function(){prompt('复制下面的内容',t)})}else prompt('复制下面的内容',t)}
document.addEventListener('click',function(e){
  var b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.v){view=b.dataset.v;history.replaceState(null,'',view==='today'?location.search.replace(/[?&]v=\w+/,''):'?'+(ISSUE.date!==LATEST.date?'d='+ISSUE.date+'&':'')+'v='+view);render();scrollTo(0,0);return}
  if(b.dataset.tab){tab=b.dataset.tab;renderToday();return}
  if(b.dataset.fav!=null){var r=REG[+b.dataset.fav];toggleFav(r[0],r[1],r[2]);render();return}
  if(b.dataset.set){S[b.dataset.set]=b.dataset.val;if(b.dataset.set==='tab')tab=S.tab;applySettings();renderSet();return}
  if(b.id==='exJson'){var blob=new Blob([JSON.stringify(FAV,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='规划师早报-收藏-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已下载');return}
  if(b.id==='exText'){if(!FAV.length){toast('还没有收藏');return}copy(FAV.map(function(f,i){return(i+1)+'. 【'+(NAMES[f.section]||'')+'】'+f.title+'（'+(f.source||'')+'，'+(f.date||'')+'）\n'+f.url}).join('\n'),'已复制 '+FAV.length+' 条');return}
  if(b.id==='clr'){if(FAV.length&&confirm('确定清空全部 '+FAV.length+' 条收藏？此操作不能撤销。')){FAV=[];save('pd_favs',FAV);renderSet();toast('已清空')}return}
  if(b.id==='share'){var u=siteUrl();if(navigator.share&&/Mobi|Android|iPhone/i.test(navigator.userAgent)){navigator.share({title:'规划师早报',text:'每天 12 条规划论文、政策、案例与 AI 工具',url:u}).catch(function(){})}else copy(u,'已复制本站链接');return}
});
(function init(){
  var q=new URLSearchParams(location.search),d=q.get('d'),v=q.get('v');
  if(v&&/^(today|fav|past|set)$/.test(v))view=v;
  if(d&&d!==LATEST.date&&DATES.indexOf(d)>=0){fetch('data/'+d+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){ISSUE=j;render()}).catch(function(){render();toast('没找到 '+d+' 这一期')})}
  render()})();
</script>
</body>
</html>

var LATEST={"date": "2026-11-15", "issue": 19, "weekday": "周日", "hero": {"label": "MORNING BRIEF", "title": "今天，先读一篇", "subtitle": "论文、政策、案例与 AI 工具，先看最值得打开的内容。本期四个栏目各 3 条。", "pick": {"section": "policies", "index": 0}}, "sections": [{"id": "papers", "name": "论文", "items": [{"title": "EASTAR：用活动事件把出行拆成“办事目的”，再按分析任务切换城市功能区表征", "source": "arXiv", "meta": "arXiv:2611.14990 · 两个真实城市数据集 · 四项预测任务", "date": "2026-11-11", "brief": "现有城市区域表征多从汇总的起讫点出行矩阵学习，不同办事目的的出行被混在一起，后面再适配任务时很难挑出真正相关的功能语义。EASTAR 把线下活动事件当作稀疏的语义锚点，把汇总出行表征分解成多个与出行目的相关的通道，并设置自由通道捕捉事件数据未覆盖的出行模式、用全局通道保留整体空间结构；再用大模型给出的先验初始化“任务—通道”相关性，结合下游监督做任务自适应路由。在两个真实城市数据集、四项预测任务上，最高可将平均绝对误差降低约 39.15%。", "use": "做职住分析、活力评估或功能区识别时，可借鉴“按出行目的拆通道、再按任务选通道”的思路，避免把通勤、购物、就医等出行混成同一种区域画像。", "detail": "英文预印本，未经同行评议，以原文为准。", "tags": ["城市功能", "出行目的", "区域表征"], "url": "https://arxiv.org/abs/2611.14990", "note": "预印本平台论文，未经同行评议"}, {"title": "让地理算法自己迭代：用大模型多智能体在合成数据上“进化”空间分区方法", "source": "arXiv", "meta": "arXiv:2611.11669 · 150 个模拟格网 + 11 个真实数据集", "date": "2026-11-08", "brief": "地理空间算法通常靠专家发现缺陷、手工改结构再验证。作者提出自我进化地理算法框架 SEGA：内层用嵌入地理知识的双循环自动生成、评估和筛选候选算法；用自动代码格式化器把任意原始算法转成内层所需的标准形式；进化只在有真实标签的合成数据上进行，得到的算法原样用于真实数据，保证结果是样本外检验。案例以两阶段 K-Models 为种子做空间体制识别，用与真实分区相比的 Rand Index 作适应度，再在 150 个模拟格网和气候、健康、水文、政治等 11 个真实数据集上评估，进化后的算法优于种子算法、无知识基线以及四种经典区划方法。", "use": "做国土空间分区、城市功能区或政策分区时，可参考“先在已知答案的模拟数据上迭代算法、再原样用于真实空间”的检验方式，把精力放在问题定义和评价设计上。", "detail": "英文预印本，未经同行评议，以原文为准。", "tags": ["空间分区", "大模型", "地理算法"], "url": "https://arxiv.org/abs/2611.11669", "note": "预印本平台论文，未经同行评议"}, {"title": "MaterialVellum：用橡皮筋、黏土和磁铁来“拧”生成式城市设计的约束", "source": "arXiv", "meta": "arXiv:2611.01800 · 城市设计等三类技术探针 · 10 人质性实验", "date": "2026-11-01", "brief": "现有生成式设计界面多靠自然语言提示。MaterialVellum 改用人们熟悉的材料特性来表达约束：例如用橡皮筋的拉伸定义区划边界，用揉捏黏土重新分配建筑密度，用磁铁的吸力组织功能关系。作者把弹性、可塑、吸引等材料可供性映射为空间、比例和关系约束，再通过拉伸、塑形、聚类等多点触控手势，把操作转成生成式 AI 管线的控制参数。除城市设计外，还演示了花艺和平面设计场景；10 人质性研究表明，材料化交互能降低非专业人员表达约束的门槛，并支持探索式设计，但效果取决于是否符合使用者的心智模型。", "use": "做控规方案比选、城市设计公众参与或生成式形态推演时，可借鉴用“可触摸约束”代替纯文字提示的交互，让密度、边界和功能关系更直观地调参。", "detail": "英文预印本，未经同行评议，以原文为准。", "tags": ["城市设计", "生成式AI", "交互"], "url": "https://arxiv.org/abs/2611.01800", "note": "预印本平台论文，未经同行评议"}]}, {"id": "policies", "name": "政策", "items": [{"title": "北京印发《责任估价师工作管理规定（试行）》：为街区控规和城市更新方案做经济可行性测算与审核", "source": "首都之窗（北京市政府门户网站）", "meta": "京规自发〔2026〕354号 · 2026年10月30日印发 · 有效期3年", "date": "2026-11-11", "flag": "外省", "brief": "北京市规划自然资源委 10 月 30 日印发、11 月 11 日在首都之窗公开。责任估价师由市、区两级规划自然资源主管部门按年度选聘，对责任单元内规划编制与实施的经济可行性开展测算和审核，并可承担重点街区、实施单元和城市更新、城中村改造等重点项目的经济可行性研究。具体工作包括陪伴式咨询、对街区控规和实施方案中的经济测算独立出具书面意见（编制与审核不得为同一机构），以及分层开展资源盘点、动态资金平衡和实施效益评估。鼓励在存量地区建立责任估价师、责任规划师、建筑师等“多师”协同机制。", "use": "编制城市更新实施方案或街区控规时，可对照其“经济测算单独审核、编制与审核机构分离”的安排，把资金平衡、权属底账和综合效益评估前置到方案比选阶段。", "detail": "外省政策；以北京市规划和自然资源委员会正式文件为准。", "tags": ["规划实施", "城市更新", "经济测算"], "url": "https://www.beijing.gov.cn/zhengce/gfxwj/202611/t20261111_4941308.html"}, {"title": "上海印发住建行业“人工智能+”行动计划：建设“城市体检—城市更新”智能体，探索更新方案模拟推演", "source": "上海市住房和城乡建设管理委员会", "meta": "沪建科信联〔2026〕474号 · 市住建委、市经信委、市数据局 · 2026—2028年", "date": "2026-11-13", "flag": "外省", "brief": "三部门 11 月 2 日联合印发、13 日公开。计划提出到 2028 年基本形成住建行业“人工智能+”应用生态；依托全市“一张图”时空数智底座和 CIM 平台建设智能化应用中枢，深化 CIM+ 在城市体检与更新等领域的应用。其中明确建设“城市体检—城市更新”智能体，以 CIM＋大模型＋知识图谱为底座，实现城市现状数据智能问图，探索更新方案模拟推演，逐步形成“体检问题—潜力片区—更新项目—成效评估”一体化管理闭环。同步布局房屋安全智能体检、历史建筑数字孪生修缮研判等场景。", "use": "谋划城市体检与更新一体化平台时，可对标其“问图—方案推演—成效评估”闭环，优先把体检问题清单与更新项目库打通。", "detail": "外省政策；以上海市住房和城乡建设管理委员会正式文件为准。", "tags": ["城市体检", "城市更新", "人工智能"], "url": "https://zjw.sh.gov.cn/jsgl/20261113/0678bec82e564245b155de147fd29f99.html"}, {"title": "武汉硚口新安九如片控规导则拟变更：居住商业用地调为商住文混合，取消内部 T 形支路、全新街由 15 米缩为 10 米", "source": "武汉市硚口区人民政府", "meta": "A050802管理单元 · 利害关系人意见征询期 11 月 10 日—19 日", "date": "2026-11-10", "flag": "外省", "brief": "为推进重点项目建设，硚口区住房和城市更新局就汉口中山大道、多福路、大夹街、友谊南路围合的 A050802 管理单元（新安九如片）控规导则变更，征求地段内利害关系人意见。拟将长堤街以南、宝庆街以西、全新街以东地块由一类、二类居住用地和商业、商务设施用地调整为商业、居住、文化混合用地，结合方案及既有街巷取消内部“T”形支路并控制多条步行廊道；同时取消公共通道 1 条、公共停车场 1 处，优化宝庆街及东侧支路线形，全新街由 15 米缩窄为 10 米。报批前还将依法公示。", "use": "在历史街区做控规深化时，可关注其“按既有街巷取消内部车行支路、改控步行廊道，并收窄部分道路红线”的处理，同时留意取消停车场后的交通与公建配套校核。", "detail": "外省政策公示；以武汉市硚口区住房和城市更新局公示及附图为准。", "tags": ["控规修改", "混合用地", "历史街区"], "url": "https://www.qiaokou.gov.cn/xxgk/jbxxgk/ggzypz/gtfwzsbc/202611/t20261110_2877248.shtml"}]}, {"id": "cases", "name": "案例", "items": [{"title": "北京大栅栏石头公园焕新开放：900 平方米闲置转角改成全龄口袋公园，绿化超过 30%", "source": "凤凰网（转北京西城）", "meta": "约 900㎡ · 大栅栏历史文化街区", "date": "2026-11-13", "brief": "大栅栏石头胡同与陕西巷交汇处的石头公园近日焕新开放。改造前，转角处业态杂乱、与德寿堂门楼相邻的露天停车占用空间，绿化不足。街道把碎片化边角空间整合腾退，园内绿化占比超过 30%，并把原有乒乓球场地纳入整体设计；球场、儿童活动布置在场地内侧，绿化花池、座椅和科普展示沿墙展开，形成动静分流。约 900 平方米场地西侧与京韵园相望，兼顾本地居民休闲和新就业群体（如快递、外卖骑手）短暂歇脚。", "use": "在历史文化街区做微更新时，可借鉴“不铺大广场、用青灰色立面和铺装协调风貌，并把动静功能分区、同时给骑手留歇脚点”的做法。", "detail": "媒体报道（转北京西城），以原文为准。", "tags": ["口袋公园", "历史街区", "微更新"], "url": "https://feng.ifeng.com/c/8y1rTaWQvVk", "note": "非官方来源（媒体报道）"}, {"title": "桦甸城区新增 3 处口袋公园全部开放：高速口与清水大街沿线闲置微隙地建成 3 万余平方米休闲空间", "source": "吉林市人民政府门户网站（来源：桦甸市）", "meta": "3 处合计 3 万余平方米 · 已全部完工开放", "date": "2026-11-13", "brief": "桦甸市聚焦城区闲置地块做绿化提升，分别在桦甸西高速口、清水大街西段、清水大街清水湾东侧新建 3 处口袋公园，目前已全部完工并向市民开放。选址多为城市微隙地带，三处合计面积 3 万余平方米。建设中采用乔灌草复层种植，搭配乡土树种与观赏花卉；同时布设健身器材、儿童游乐设施、休闲座椅和慢行步道，兼顾老年健身、亲子游玩和日常休憩。", "use": "做中小城市绿地补盲时，可参考沿高速出入口和主要大街边角地连续布点、把绿化和全龄设施一次性配齐的做法。", "detail": "地方政府网站报道，以原文为准。", "tags": ["口袋公园", "闲置空间", "全龄友好"], "url": "https://www.jlcity.gov.cn/yw/xsyw/202611/t20261113_1344168.html"}, {"title": "平度两处口袋公园建成开放：一处服务小区门口，一处围合两株三百余年银杏就地建园", "source": "信网", "meta": "昆明路、太原路两处 · 平度市城乡建设局", "date": "2026-11-13", "brief": "平度市昆明路口袋公园与太原路口袋公园相继建成开放。太原路口袋公园位于太原路中通州路至杭州路段，为公园壹号小区提供就近休闲配套；昆明路口袋公园位于常州路西侧、临近绿城·春风雅园，园中保留两株三百余年银杏，在保护根系的同时提供树下休憩空间。选址紧扣居住区周边，利用道路建设和街角整治腾出的零散地块见缝插绿，不追求面积和投资规模。市城乡建设局称，下一步将继续结合城市更新和道路腾退用地挖掘街角空间。", "use": "遇到古树与街角整治叠加的地块时，可借鉴“围树建园、先护根系再布置休憩”的做法，把保护要求做成口袋公园的核心景观。", "detail": "媒体报道，以原文为准。", "tags": ["口袋公园", "古树保护", "微更新"], "url": "https://www.qdxin.cn/xin/2026/396182.html", "note": "非官方来源（媒体报道）"}]}, {"id": "tools", "name": "AI工具", "items": [{"title": "杭州设计方案智能审查落地：150 余条规则上图，符合场景的总平面智能校核约 10 分钟；萧山一住宅地块拿地 5 天启动公示", "source": "杭州网（来源：杭州日报）", "meta": "杭州市规划和自然资源局 · 萧山区钱江世纪城杭政储出〔2026〕78号地块", "date": "2026-11-10", "flag": "外省", "brief": "杭政储出〔2026〕78 号地块（萧山钱江世纪城，规划 5 幢 20—23 层住宅）10 月 30 日成交，11 月 4 日即发布设计方案公示，用时 5 天。杭州今年 10 月要求除企业自身原因外，拿地后 15 天内完成方案联审并启动公示。市规划和自然资源局把技术服务前移到土地挂牌阶段，在出让公告中提供设计方案智能自检指南，设计单位可对照制图规范预检。部门将方案审查涉及的 150 余条规则拆成系统可执行标准，覆盖制图规范、规划指标、建筑间距和退让等，不合规处可定位到图并列出规范依据；符合场景要求的总平面相关核查，智能校核约 10 分钟即可完成（以往人工约需 1 到 2 天）。该能力是杭州“一张图”智慧规划试点 13 个智能场景之一。", "use": "做方案报审或建设智能辅助审查时，可参考“挂牌期开放自检、成交后联动联审，把间距、退让、指标做成可定位到图的规则库”的流程。", "detail": "外省做法；媒体报道，以杭州市规划和自然资源局实际系统和相关文件为准。", "tags": ["智能审查", "规划许可", "一张图"], "url": "https://hznews.hangzhou.com.cn/chengshi/content/2026-11/10/content_9369208.htm", "note": "非官方来源（媒体报道）"}, {"title": "Esri 11 月更新地理空间 AI：用 MCP 给外部智能体接上 GIS，并可用自然语言在地图上查变化、找类似地物", "source": "Esri ArcGIS Blog", "meta": "ArcGIS Online / Enterprise 12.2 · 2026 年 11 月 9 日", "date": "2026-11-09", "brief": "Esri 介绍 11 月地理空间 AI 更新：ArcGIS 可通过模型上下文协议（MCP，目前在 Location Platform 和 Enterprise 上处于测试）为 Claude、Microsoft Copilot Studio 等外部智能体提供找地点、路径和空间查询等能力；无代码方面，Instant Apps 的 Data Explorer 模板和 Experience Builder 的 AI 对话（测试）可用自然语言查询已有地图。ArcGIS Pro 3.8 增加地球观测基础模型 EO-DINO，以及“按文字描述查找地物”“用嵌入向量做变化检测”等工具，并可用三维检测把窗、车辆等对象落到正确深度。AI 功能默认关闭，由管理员按角色开通；官方称提示和数据默认不用于训练模型。", "use": "已有 ArcGIS 底图和图层的规划院，可先在测试环境试用自然语言问图和变化检测，用于用地监测、相似地块检索，再评估是否对外部智能体开放 MCP 接口。", "detail": "厂商技术博客，功能和许可以 Esri 官方文档及实际版本为准。", "tags": ["GIS", "智能体", "遥感"], "url": "https://www.esri.com/arcgis-blog/products/arcgis/geoai/whats-new-in-geospatial-ai-november-2026"}, {"title": "百度地图在乌镇峰会开放“时空智能基座”：向智能体提供可调用的地点、路线与动态环境能力", "source": "经济参考网（新华社《经济参考报》）", "meta": "2026 世界互联网大会乌镇峰会时空智能论坛 · 11 月 5 日", "date": "2026-11-06", "brief": "11 月 5 日乌镇峰会首次设置时空智能论坛。百度地图介绍由数据层、模型层和智能体层构成的时空智能基座，将空间感知、时间推演和决策能力向汽车、交通、物流、文旅等领域开放；并推出面向智能体的原生支持、零代码技能包，以及自然语言代码生成工具脉芽 MAPYA 和百度地图 CLI，称相关接入可将开发周期从约 2 天缩短到分钟级。应用侧提到杭州东站跨空间连续导航、停车场车位到车位导航，以及道路异常预警、景区人流和车位感知等。论坛同时提出“五方参与、五维协同”的产业共建路径。", "use": "做交通枢纽导引、景区或商圈人流组织，以及把规划分析接入智能体时，可关注这类可调用的实时地点、路径和动态环境接口，注意以实际开放接口和数据许可为准。", "detail": "媒体报道，能力开放范围和接口以百度地图官方说明为准。", "tags": ["时空智能", "智能体", "出行服务"], "url": "http://jjckb.xinhuanet.com/20261106/18397390cfa5478083f8983538261902/c.html", "note": "非官方来源（媒体报道）"}]}]};
var DATES=["2026-10-25", "2026-10-26", "2026-10-27", "2026-10-28", "2026-10-29", "2026-10-30", "2026-10-31", "2026-11-01", "2026-11-02", "2026-11-03", "2026-11-04", "2026-11-05", "2026-11-06", "2026-11-07", "2026-11-08", "2026-11-09", "2026-11-10", "2026-11-11", "2026-11-12", "2026-11-13", "2026-11-14", "2026-11-15"];
var NAMES={papers:'论文',policies:'政策',cases:'案例',tools:'AI工具'};
var ORDER=['papers','policies','cases','tools'];
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=Object.assign({theme:'dark',fs:'md',tab:'all',target:'new'},load('pd_settings',{}));
var FAV=load('pd_favs',[]);
var ISSUE=LATEST, tab=S.tab, view='today';
var WD=['周日','周一','周二','周三','周四','周五','周六'];
function md(dt){var p=dt.split('-');return p[1]+'.'+p[2]}
function wd(dt){var p=dt.split('-');return WD[new Date(+p[0],p[1]-1,+p[2]).getDay()]}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},1600)}
function applySettings(){var t=S.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.dataset.fs=S.fs;save('pd_settings',S)}
matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){if(S.theme==='system')applySettings()});
function key(it){return it.url}
function isFav(it){return FAV.some(function(f){return f.url===it.url})}
function toggleFav(it,sec,date){if(isFav(it)){FAV=FAV.filter(function(f){return f.url!==it.url});toast('已取消收藏')}else{FAV.unshift({title:it.title,url:it.url,source:it.source,date:it.date,brief:it.brief,use:it.use,section:sec,issue:date,note:it.note,flag:it.flag,savedAt:Date.now()});toast('已收藏')}save('pd_favs',FAV)}
function tgt(){return S.target==='same'?'':' target="_blank" rel="noopener"'}
function card(it,sec,date,idx){
  var star=isFav(it);
  var h='<article class="card" data-sec="'+sec+'"><button class="star'+(star?' on':'')+'" data-fav="'+idx+'" aria-label="收藏">'+(star?'★':'☆')+'</button>';
  h+='<div class="meta"><span class="cat '+sec+'">'+NAMES[sec]+'</span><span>·</span><span>'+esc(it.source)+(it.note?' ※':'')+'</span><span>·</span><span>'+esc(it.date||'')+'</span>'+(it.flag?'<span class="flag">'+esc(it.flag)+'</span>':'')+'</div>';
  h+='<h3>'+esc(it.title)+'</h3><p class="brief">'+esc(it.brief)+'</p>';
  if(it.use)h+='<p class="use"><b>规划用法</b>　'+esc(it.use)+'</p>';
  if(it.detail||it.meta||it.tags){h+='<details><summary>展开详情 ▾</summary><div class="det">'+(it.meta?'<div class="m">'+esc(it.meta)+'</div>':'')+(it.detail?esc(it.detail):'')+'</div>'+(it.tags&&it.tags.length?'<div class="tags">'+it.tags.map(function(t){return'<span>'+esc(t)+'</span>'}).join('')+'</div>':'')+'</details>'}
  if(it.note)h+='<p class="note">※ '+esc(it.note)+'</p>';
  h+='<div class="acts"><a class="btn pri" href="'+esc(it.url)+'"'+tgt()+'>打开原文</a>'+(it.extra?'<a class="btn sec" href="'+esc(it.extra.url)+'"'+tgt()+'>'+esc(it.extra.label)+'</a>':'')+'</div></article>';
  return h}
var REG=[];
function allItems(d){var a=[];ORDER.forEach(function(id){var s=(d.sections||[]).find(function(x){return x.id===id});if(s)s.items.forEach(function(it){a.push([it,id])})});return a}
function renderToday(){
  var d=ISSUE,items=allItems(d);REG=[];
  $('#dt').textContent=md(d.date)+' '+(d.weekday||wd(d.date));
  var hero=d.hero||{},pk='';
  if(hero.pick){var ps=d.sections.find(function(x){return x.id===hero.pick.section});var pi=ps&&ps.items[hero.pick.index];if(pi)pk='<a class="pick" href="'+esc(pi.url)+'"'+tgt()+'><b>首推</b>'+esc(pi.title)+' →</a>'}
  var h='';
  if(d.date!==LATEST.date)h+='<div class="banner">正在看往期 '+esc(d.date)+' · <a href="./">回到今日</a></div>';
  h+='<section class="hero"><div class="l"><div class="lab">'+esc(hero.label||'MORNING BRIEF')+'</div><h2>'+esc(hero.title||'今天，先读一篇')+'</h2><p>'+esc(hero.subtitle||'论文、政策、案例与 AI 工具，先看最值得打开的内容。')+'</p>'+pk+'</div><div class="num"><b>'+items.length+'</b><span>条待读</span></div></section>';
  h+='<div class="tabs">'+['all'].concat(ORDER).map(function(t){return'<button data-tab="'+t+'" class="'+(t===tab?'on':'')+'">'+(t==='all'?'全部':NAMES[t])+'</button>'}).join('')+'</div><div id="cards">';
  items.forEach(function(p){if(tab==='all'||tab===p[1]){REG.push([p[0],p[1],d.date]);h+=card(p[0],p[1],d.date,REG.length-1)}});
  if(!REG.length)h+='<div class="empty">这一期这个栏目暂时没有内容</div>';
  $('#view').innerHTML=h+'</div>'}
function renderFav(){
  REG=[];$('#dt').textContent='共 '+FAV.length+' 条';
  var h='<div class="ptitle">收藏夹</div>';
  if(!FAV.length)h+='<div class="empty">还没有收藏。点卡片右上角的 ☆ 就能收藏，收藏会保存在这台设备的浏览器里。</div>';
  FAV.forEach(function(f){REG.push([f,f.section,f.issue]);var it=Object.assign({},f);h+=card(it,f.section||'papers',f.issue,REG.length-1).replace('</h3>','</h3>'+(f.issue?'<div class="meta" style="margin:-2px 0 6px">收自 '+esc(f.issue)+' 期</div>':''))});
  $('#view').innerHTML=h}
function renderPast(){
  $('#dt').textContent=DATES.length+' 期';
  var h='<div class="ptitle">往期</div><div class="list">';
  DATES.slice().reverse().forEach(function(dt,i){h+='<a href="?d='+dt+'" class="'+(dt===ISSUE.date?'cur':'')+'">第 '+(DATES.length-i)+' 期 · '+dt+'<span>'+wd(dt)+(dt===LATEST.date?' · 最新':'')+'</span></a>'});
  $('#view').innerHTML=h+'</div>'}
function seg(name,opts){return'<div class="seg">'+opts.map(function(o){return'<button data-set="'+name+'" data-val="'+o[0]+'" class="'+(S[name]===o[0]?'on':'')+'">'+o[1]+'</button>'}).join('')+'</div>'}
function renderSet(){
  $('#dt').textContent='本机保存';
  var h='<div class="ptitle">设置</div>';
  h+='<div class="group"><h4>显示</h4><div class="row"><span class="k">外观</span>'+seg('theme',[['dark','深色'],['light','浅色'],['system','跟随系统']])+'</div><div class="row"><span class="k">字号</span>'+seg('fs',[['sm','小'],['md','标准'],['lg','大']])+'</div><div class="row"><span class="k">默认栏目</span>'+seg('tab',[['all','全部'],['papers','论文'],['policies','政策'],['cases','案例'],['tools','AI工具']])+'</div><div class="row"><span class="k">链接打开方式</span>'+seg('target',[['new','新标签页'],['same','当前页']])+'</div></div>';
  h+='<div class="group"><h4>收藏管理（'+FAV.length+' 条）</h4><div class="row"><span class="k">导出收藏</span><span><button class="sbtn" id="exJson">下载 .json</button> <button class="sbtn" id="exText">复制为文本</button></span></div><div class="row"><span class="k">清空收藏</span><button class="sbtn danger" id="clr">清空</button></div></div>';
  h+='<div class="group"><h4>分享</h4><div class="row"><span class="k">把早报分享给同事</span><button class="sbtn" id="share">复制本站链接</button></div></div>';
  h+='<div class="group"><h4>关于</h4><div class="about"><p>每天早上 8 点前更新：论文、政策、案例、AI 工具各 3 条。</p><p>内容来自公开来源，※ 表示非官方转载或媒体报道；“外省”表示非江苏本省文件。</p><p>仅供参考，以原文为准。设置和收藏只保存在本机浏览器里。</p></div></div>';
  $('#view').innerHTML=h}
function render(){document.querySelectorAll('nav.bar button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});({today:renderToday,fav:renderFav,past:renderPast,set:renderSet})[view]();}
function siteUrl(){return location.origin+location.pathname}
function copy(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(ok)},function(){prompt('复制下面的内容',t)})}else prompt('复制下面的内容',t)}
document.addEventListener('click',function(e){
  var b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.v){view=b.dataset.v;history.replaceState(null,'',view==='today'?location.search.replace(/[?&]v=\w+/,''):'?'+(ISSUE.date!==LATEST.date?'d='+ISSUE.date+'&':'')+'v='+view);render();scrollTo(0,0);return}
  if(b.dataset.tab){tab=b.dataset.tab;renderToday();return}
  if(b.dataset.fav!=null){var r=REG[+b.dataset.fav];toggleFav(r[0],r[1],r[2]);render();return}
  if(b.dataset.set){S[b.dataset.set]=b.dataset.val;if(b.dataset.set==='tab')tab=S.tab;applySettings();renderSet();return}
  if(b.id==='exJson'){var blob=new Blob([JSON.stringify(FAV,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='规划师早报-收藏-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已下载');return}
  if(b.id==='exText'){if(!FAV.length){toast('还没有收藏');return}copy(FAV.map(function(f,i){return(i+1)+'. 【'+(NAMES[f.section]||'')+'】'+f.title+'（'+(f.source||'')+'，'+(f.date||'')+'）\n'+f.url}).join('\n'),'已复制 '+FAV.length+' 条');return}
  if(b.id==='clr'){if(FAV.length&&confirm('确定清空全部 '+FAV.length+' 条收藏？此操作不能撤销。')){FAV=[];save('pd_favs',FAV);renderSet();toast('已清空')}return}
  if(b.id==='share'){var u=siteUrl();if(navigator.share&&/Mobi|Android|iPhone/i.test(navigator.userAgent)){navigator.share({title:'规划师早报',text:'每天 12 条规划论文、政策、案例与 AI 工具',url:u}).catch(function(){})}else copy(u,'已复制本站链接');return}
});
(function init(){
  var q=new URLSearchParams(location.search),d=q.get('d'),v=q.get('v');
  if(v&&/^(today|fav|past|set)$/.test(v))view=v;
  if(d&&d!==LATEST.date&&DATES.indexOf(d)>=0){fetch('data/'+d+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){ISSUE=j;render()}).catch(function(){render();toast('没找到 '+d+' 这一期')})}
  render()})();
</script>
</body>
</html>

var LATEST={"date": "2026-11-22", "issue": 26, "weekday": "周日", "hero": {"label": "MORNING BRIEF", "title": "今天，先读一篇", "subtitle": "论文、政策、案例各 3 条，AI 工具 1 条。近 14 天内可核对原文、且未与往期重复的 AI 工具条目本期落实 1 条。", "pick": {"section": "policies", "index": 0}}, "sections": [{"id": "papers", "name": "论文", "items": [{"title": "大伦敦步行友好度与心血管代谢疾病：城市整体空间结构会把“街区效应”放大", "source": "arXiv", "meta": "arXiv:2611.26573 · Benjamin T. Pike / Stephen Law / Sanja Šćepanović / Linus W. Dietz", "date": "2026-11-19", "brief": "步行环境常被看作有助于降低心血管和代谢疾病风险，但城市尺度的相关关系，可能把街区形态与都市整体结构、伴随暴露混在一起。作者用开放的五项步行友好指数，覆盖大伦敦 4994 个普查单元，并匹配初级医疗登记中 8 类心血管代谢疾病患病率。校正人口结构与剥夺程度后，步行友好度更高的单元 8 类疾病患病率都更低：步行友好度提高一个标准差，高血压患病率低 1.43 个百分点。步行友好度本身呈明显的中心—外围梯度，径向模型可解释其 74.2% 的变异；在自治市内部、或再控制中心—外围结构后，系数分别下降 2%—43% 和 11%—75%。加入空间误差调整后，肥胖的关联不再清楚，其余 7 项系数相对可比的对数模型下降 83%—99%。不过，与保留这一空间结构的替代步行表面相比，观测到的关联在主要分析中仍对全部 8 项结果更极端，控制氮氧化物后仍有 5 项如此。作者提醒：不宜把全市尺度系数直接当成独立于都市结构的“街区效应”。", "use": "做15分钟生活圈、步行环境与健康评估时，先分清城市整体结构与局部街区形态，避免只用全市回归系数去推断某一街区改街道就会同等降病。", "detail": "英文预印本，未经同行评议，以原文为准。", "tags": ["步行友好", "健康城市", "空间分析"], "url": "https://arxiv.org/abs/2611.26573", "note": "预印本平台论文，未经同行评议"}, {"title": "墨西哥城伊兹塔帕拉帕：15 处社区公共设施是在加固原有中心，还是在创造新的多中心条件", "source": "arXiv", "meta": "arXiv:2611.24758 · Marco A. Rosas / Gustavo Carreón / Carlos Gershenson / Jesús Mario Siqueiros", "date": "2026-11-18", "brief": "社会设施的空间分布，能否强化已有功能中心，或为新中心出现创造条件，仍缺少足够讨论。作者以墨西哥城伊兹塔帕拉帕历史上服务不足的地区为对象，围绕 UTOPÍAS 计划已建成的 15 处公共社会设施，构建多层网络：叠加步行设施、基于 GTFS 的公共交通，并把 UTOPÍAS 作为目标层，评估多模式连通、出行时间可达性和空间覆盖，再与地方经济中心性指标（PCI、wPCI）对照。分析显示，多模式可达性存在空间差异，各设施与既有交通网的整合程度也不相同。作者据此讨论分布式社会设施是更可能加固已有功能中心，还是更有利于新中心萌芽，并明确不把空间分散直接等同于多中心。文章提供了一种把社会设施与出行网络放在一起看功能组织的数据方法，强调可达性和地域整合是更公平、可持续的城市发展条件。", "use": "评估社区中心、邻里中心选址时，可把步行与公交可达、与既有经济中心的关系一起看，避免只讲“多点布局”却未检验是否真的形成新的服务中心。", "detail": "英文预印本，未经同行评议，以原文为准。", "tags": ["社会设施", "多中心", "可达性"], "url": "https://arxiv.org/abs/2611.24758", "note": "预印本平台论文，未经同行评议"}, {"title": "用卫星变化检测盯“未规划建设”要谨慎：方法能发现地表变化，并不能判断是否获批", "source": "arXiv", "meta": "arXiv:2611.24190 · Harsh Kashyap / Taranum Wasu", "date": "2026-11-18", "brief": "城市建设会改变用地，也可能挤占自然空间、加重公共服务负担。印度国家转型委员会（NITI Aayog）2021 年报告曾提出，当时 7933 个城镇居民点中 65% 没有总体规划，但这一数字只说明规划覆盖情况，并不能用来判断某一栋建筑是否经过许可。作者测试用预训练神经网络把卫星影像编成特征，再交给常规机器学习分类器识别用地类别和变化，并在印度以外的两个公开数据集上评估：建成区识别准确率约 95%，对“一小对影像是否发生变化”的判断准确率约 83%。他们还在标准变化检测基准上训练了小型神经网络，并对阿格拉 48 个图斑（其中 7 个为阳性）做了初步描述性检查。结论很明确：卫星影像携带了地表变化信息，但这些结果并不能说明建设是否经过规划或许可。", "use": "用遥感做违法建设或建设动态监测时，可把变化检测当作线索，但必须与规划许可、一张图管理信息核对，不能把“影像有变化”直接写成“未批先建”。", "detail": "英文预印本，未经同行评议，以原文为准。", "tags": ["遥感监测", "建设监管", "变化检测"], "url": "https://arxiv.org/abs/2611.24190", "note": "预印本平台论文，未经同行评议"}]}, {"id": "policies", "name": "政策", "items": [{"title": "北京东城区就“十五五”城市更新发展规划公开征求意见：谋划 21 个综合化更新组团，优先完成市属 2000 年底前老旧小区改造扫尾", "source": "首都之窗（北京市政府门户网站）", "meta": "东城区住房和城市建设委员会 · 征求意见期 2026年11月19日至12月2日", "date": "2026-11-19", "flag": "外省", "brief": "为落实北京城市总体规划、首都功能核心区控规和《北京市城市更新条例》，东城区住建委编制《“十五五”时期东城区城市更新发展规划》（征求意见稿），11月19日起公开征求意见，至12月2日。规划提出打造“一横一纵一圈多片”的更新空间结构，并据此谋划 21 个综合化城市更新组团，推动存量空间提质。人居方面，持续开展平房院落保护修缮、加大危旧楼房改造，并深入实施老旧小区综合整治：优先完成市属 2000 年底前建成老旧小区的改造扫尾，同时推动属地央军产小区改造和物业全覆盖；还部署完整社区建设和公共服务均衡布局。产业与公共空间方面，提出推动老旧厂房、产业园区和低效楼宇更新，持续建设口袋公园及小微绿地，并推进站城一体化和历史文化街区保护更新。意见可通过邮箱 dczjpqch@163.com、书面邮寄、电话或政府网站征集专栏反馈。", "use": "做首都功能核心区或历史文化名城更新规划时，可对照“空间结构—重点组团—老旧小区扫尾—完整社区”的层次，把文物腾退、物业长效和公共空间提升一并纳入，而非只列项目清单。", "detail": "外省政策；征求意见稿，最终以正式印发文本为准。", "tags": ["城市更新", "老旧小区", "首都功能核心区"], "url": "https://www.beijing.gov.cn/hudong/gfxwjzj/qjzjxx/202611/t20261119_4953028.html"}, {"title": "洛阳公示洛邑古城及周边 7 个街坊详细规划：总用地 27.44 公顷，优化用地与交通，落实文物保护范围", "source": "凤凰网大风号（转洛阳规划公示信息）", "meta": "洛阳市中心城区 LC13-B-16 至 22 街坊 · 公示期 2026年11月20日至12月19日", "date": "2026-11-20", "flag": "外省", "brief": "洛阳市中心城区 LC13-B-16、17、18、19、20、21、22 街坊详细规划自 11 月 20 日起批前公示，至 12 月 19 日。街坊东至新伊大街、西至御路街—中和巷、南至吕氏街—小石桥街、北至东大街，总用地面积 27.44 公顷。公示提出，为促进洛邑古城文旅发展和历史文化街区更新，对古城及周边街坊的用地性质、交通系统和控制指标进行优化：延续街巷格局，预留洛邑古城内部弹性道路；结合《洛阳市东西南隅历史文化街区保护规划（2019—2035年）》等，落实金元故城、河南府文庙、妥灵宫、文峰塔等用地范围，优化文化、商业、商住用地布局并完善公服配套，同时对风貌、文物保护、基础设施、城市“六线”和综合防灾作出引导。意见可在公示期内书面或发送至 jsydk369@163.com，书面意见送洛阳市自然资源和规划局详细规划科。官方查询网址为 http://lybnrp.ly.gov.cn/。", "use": "历史城区控规优化时，可先把文物和保护规划范围落到图上，再谈文旅用地和弹性道路，避免为疏解交通或增加经营面积挤占保护用地。", "detail": "外省政策；媒体转载的批前公示信息，方案内容、图则和意见渠道以洛阳市自然资源和规划局正式公布为准。", "tags": ["控制性详细规划", "历史文化街区", "城市更新"], "url": "https://feng.ifeng.com/c/8yE9aKlU8wK", "note": "非官方来源（媒体报道）"}, {"title": "义乌公示稠城街道 YZ-CC-03 单元控规修改：拟取消并拓宽部分支路，并调整用地边界、性质和开发强度", "source": "凤凰网大风号（来源：中国义乌）", "meta": "机场路与城中路交叉口北侧区块 · 公示期 2026年11月18日至12月18日", "date": "2026-11-18", "flag": "外省", "brief": "据凤凰网转载“中国义乌”11 月 21 日消息，义乌市已于 11 月 18 日起，对稠城街道 YZ-CC-03 单元机场路与城中路交叉口北侧区块控制性详细规划修改方案公示，至 12 月 18 日。公示称，为加快该区块建设，组织编制了修改方案并公告征求意见。调整内容包括：取消及拓宽部分城市支路；修正部分现状用地边界及性质，同时谋划重点开发地块；对容积率、建筑密度、建筑限高和绿地率等指标作相应调整。", "use": "路口周边控规修改时，应同步核对接线支路是取消还是拓宽、用地性质与强度如何联动，避免只提高开发量却未交待交通和配套。", "detail": "外省政策；媒体转载，修改图则、具体指标和意见渠道以义乌市自然资源和规划局正式公示为准。", "tags": ["控制性详细规划", "道路调整", "开发强度"], "url": "https://feng.ifeng.com/c/8yEfkrntpqX", "note": "非官方来源（媒体报道）"}]}, {"id": "cases", "name": "案例", "items": [{"title": "黄石通报今年完成 28 个老旧小区改造，超过年度 22 个计划，惠及 2.04 万户", "source": "长江日报", "meta": "黄石市住房和城市更新局新闻发布会 · 累计完成投资 6.16 亿元", "date": "2026-11-20", "flag": "外省", "brief": "11 月 20 日，黄石举行新闻发布会通报：年度计划改造老旧小区 22 个，实际改造完成 28 个；累计完成投资 6.16 亿元，惠及居民 2.04 万户。市住房和城市更新局介绍，改造实行“群众点单、政府配菜、一小区一方案”。发布会举例：黄石港区市建村社区完成管网更新、道路硬化，并新增停车位、路灯、文化亭和健身广场；西塞山区袁海湾社区翻新人行道、修补路面、打通街巷堵点、盘活闲置公共空间；下陆区石榴园社区竹林苑小区整治楼顶防水、更新雨水落水管、优化排水、翻新外墙，并增设休闲游园和停车位。报道称，自 2024 年以来全市累计谋划实施改造项目 114 个、总投资 22.26 亿元，惠及约 8.48 万户；并争取到中央预算内城市更新专项资金 10.9 亿元、保障性安居工程提前批补助资金 4.33 亿元。", "use": "老旧小区改造可把“一小区一方案”落到管网、道路、停车和公共空间上，并尽早对接中央预算内和专项债等资金渠道，避免只做外墙翻新。", "detail": "外省实践；媒体报道的发布会数据，以黄石市住房和城市更新局公布为准。", "tags": ["老旧小区", "城市更新", "民生配套"], "url": "http://news.cjn.cn/csqpd/hs_20005/202611/t5361001.htm", "note": "非官方来源（媒体报道）"}, {"title": "拉萨城关区 54 个老旧小区提质改造已完成 44 个：先地下后地上，雨污分流并补充电桩和健身场地", "source": "中国西藏新闻网", "meta": "总投资 5.07 亿元 · 惠及 1.47 万户", "date": "2026-11-20", "flag": "外省", "brief": "中国西藏新闻网 11 月 20 日报道，2026 年拉萨市城关区启动 54 个老旧小区提质改造，总投资 5.07 亿元，惠及 1.47 万户，目前已有 44 个小区完成改造。城关区住建局介绍，项目   if(b.dataset.set){S[b.dataset.set]=b.dataset.val;if(b.dataset.set==='tab')tab=S.tab;applySettings();renderSet();return}
  if(b.id==='exJson'){var blob=new Blob([JSON.stringify(FAV,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='规划师早报-收藏-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已下载');return}
  if(b.id==='exText'){if(!FAV.length){toast('还没有收藏');return}copy(FAV.map(function(f,i){return(i+1)+'. 【'+(NAMES[f.section]||'')+'】'+f.title+'（'+(f.source||'')+'，'+(f.date||'')+'）\n'+f.url}).join('\n'),'已复制 '+FAV.length+' 条');return}
  if(b.id==='clr'){if(FAV.length&&confirm('确定清空全部 '+FAV.length+' 条收藏？此操作不能撤销。')){FAV=[];save('pd_favs',FAV);renderSet();toast('已清空')}return}
  if(b.id==='share'){var u=siteUrl();if(navigator.share&&/Mobi|Android|iPhone/i.test(navigator.userAgent)){navigator.share({title:'规划师早报',text:'每天 12 条规划论文、政策、案例与 AI 工具',url:u}).catch(function(){})}else copy(u,'已复制本站链接');return}
});
(function init(){
  var q=new URLSearchParams(location.search),d=q.get('d'),v=q.get('v');
  if(v&&/^(today|fav|past|set)$/.test(v))view=v;
  if(d&&d!==LATEST.date&&DATES.indexOf(d)>=0){fetch('data/'+d+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){ISSUE=j;render()}).catch(function(){render();toast('没找到 '+d+' 这一期')})}
  render()})();
</script>
